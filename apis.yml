aid: equityzen
name: EquityZen
description: EquityZen is a New York-based financial technology platform and marketplace for
  investing in shares of private, late-stage, venture-backed companies before they IPO. Founded
  in 2013, it connects accredited investors seeking access to pre-IPO equity with employees and
  early shareholders of private companies who are looking for liquidity, transacting through
  EquityZen-managed funds and secondary-market share sales. The platform handles the sourcing,
  legal, and administrative work of private-company share transfers. EquityZen publishes no
  public developer API, SDK, or documented API surface; this profile captures its company
  identity and domain-security posture for the API Evangelist network.
